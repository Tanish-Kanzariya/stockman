kind: wasmer.io/App.v0
name: stockman
app_id: da_2J7IAtxU5yW3
owner: tanish-kanzariya
package: .
env:
  APP_NAME: StockMan
  APP_ENV: production
  APP_DEBUG: 'false'
  APP_URL: https://stockman.wasmer.app
  DB_CONNECTION: mysql
  SESSION_DRIVER: file
  SESSION_SECURE_COOKIE: 'true'
  SESSION_HTTP_ONLY: 'true'
  SESSION_SAME_SITE: lax
  LOG_CHANNEL: stderr
capabilities:
  database:
    engine: mysql
volumes:
  - name: stockman-storage
    mount: /app/public/storage
jobs:
  - name: migrate-database
    trigger: post-deployment
    action:
      execute:
        command: php
        cli_args:
          - /app/artisan
          - migrate
          - --force
        env:
          DB_CONNECTION: mysql
  - name: after_deploy
    trigger: post-deployment
    action:
      execute:
        command: after_deploy
annotations:
  anybuild.run/config:
    composer_build_script: post-update-cmd
    composer_enable: true
    name: out
    node_build_command: npm run build
    node_install_inputs:
    - package.json
    node_package_manager: npm
    npm_version: '11'
    php_framework: laravel
    php_public_dir: public
    phpix: true
  anybuild.run/provider: laravel
  anybuild.run/version: 0.29.0
  wasmer.io/version: 7.4.2
enableDatabase: true
